server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: bookleaf-portal
  config:
    # Allow a plain `.env` file (KEY=value) to supply configuration, so the app can
    # be started with `mvn spring-boot:run` without exporting variables by hand.
    # Environment variables still take precedence over the file.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookleaf}
    username: ${DB_USERNAME:bookleaf}
    password: ${DB_PASSWORD:bookleaf}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # Must be overridden in every deployed environment (Render/production).
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-32-chars-min}
    issuer: ${JWT_ISSUER:bookleaf-portal}
    access-token-ttl: ${JWT_ACCESS_TTL:PT30M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    secure-cookies: ${SECURE_COOKIES:false}
  seed:
    enabled: ${SEED_ENABLED:true}
    data-path: ${SEED_DATA_PATH:classpath:data/bookleaf_sample_data.json}
    author-password: ${SEED_AUTHOR_PASSWORD:Author@1234}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@1234}
  ai:
    # Provider is auto-detected from the API keys below. "none" => heuristic fallback only.
    provider: ${AI_PROVIDER:auto}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      model: ${ANTHROPIC_MODEL:claude-3-5-haiku-latest}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_MODEL:gpt-4o-mini}
    triage-model: ${AI_TRIAGE_MODEL:}
    draft-model: ${AI_DRAFT_MODEL:}
    triage-max-output-tokens: ${AI_TRIAGE_MAX_TOKENS:300}
    draft-max-output-tokens: ${AI_DRAFT_MAX_TOKENS:700}
    request-timeout: ${AI_REQUEST_TIMEOUT:PT20S}
    knowledge-base-path: ${AI_KB_PATH:classpath:knowledge/knowledge-base.md}
    knowledge-top-sections: ${AI_KB_TOP_SECTIONS:3}
    # One concurrent LLM call. A second concurrent request needs its own copy of
    # the context, which on a self-hosted model means loading it twice.
    max-concurrent-calls: ${AI_MAX_CONCURRENT_CALLS:1}
    # Classify in the background so creating a ticket never blocks on the model.
    triage-async: ${AI_TRIAGE_ASYNC:true}

logging:
  level:
    com.bookleaf.portal: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
